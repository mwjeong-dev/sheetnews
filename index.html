<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="연합뉴스 RSS를 엑셀 스타일 표로 보는 개인용 뉴스 뷰어" />
    <title>SHEETNEWS.xlsx</title>
    <style>
      :root {
        color-scheme: light;
        --grid: #d9d9d9;
        --header: #f3f3f3;
        --accent: #217346;
        --accent-dark: #185c37;
        --text: #222;
        --muted: #666;
        --row-number-width: 48px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100dvh;
        background: #f7f7f7;
        color: var(--text);
        font-family: Aptos, "Segoe UI", "Malgun Gothic", sans-serif;
      }
      button { font: inherit; }
      .app {
        width: 100%;
        min-height: 100dvh;
        height: 100dvh;
        margin: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .titlebar {
        min-height: 36px;
        padding: 5px 12px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: #fff;
        background: var(--accent-dark);
      }
      .book-icon {
        display: grid;
        place-items: center;
        width: 31px;
        height: 27px;
      }
      .book-icon svg { display: block; width: 31px; height: 27px; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .2px; }
      .ribbon-tabs { display: flex; gap: 2px; padding: 0 12px; height: 34px; background: var(--accent-dark); color: #fff; }
      .ribbon-tab { border: 0; padding: 0 11px; background: transparent; color: inherit; cursor: default; font-size: 13px; }
      .ribbon-tab.active { border-bottom: 3px solid #fff; font-weight: 700; }
      .ribbon { display: flex; min-height: 68px; padding: 7px 13px; border-bottom: 1px solid #c9c9c9; background: #fafafa; overflow-x: auto; overflow-y: hidden; }
      .ribbon-group { display: flex; align-items: center; gap: 6px; min-width: 123px; padding: 0 15px 16px 0; margin-right: 14px; border-right: 1px solid #ddd; position: relative; }
      .ribbon-group::after { content: attr(data-label); position: absolute; bottom: 0; left: 0; right: 0; color: #777; font-size: 10px; text-align: center; }
      .ribbon-button { border: 1px solid transparent; border-radius: 2px; padding: 8px 7px; background: transparent; color: #333; font-size: 12px; }
      .ribbon-button.large { font-weight: 700; font-size: 16px; }
      .formula-bar { display: grid; grid-template-columns: 72px 30px minmax(0, 1fr); height: 31px; border-bottom: 1px solid #bfbfbf; background: #fff; }
      .name-box, .fx, .formula-value { display: flex; align-items: center; padding: 0 8px; border-right: 1px solid #d2d2d2; color: #444; font-size: 12px; }
      .fx { justify-content: center; color: #777; font-style: italic; font-weight: 700; }
      .formula-value { border-right: 0; color: #555; }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 35px;
        padding: 5px 12px;
        border-bottom: 1px solid var(--grid);
        background: #fff;
      }
      .feed-label { min-width: 0; flex: 1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
      #updated-at { color: var(--muted); font-size: 12px; white-space: nowrap; }
      #refresh {
        border: 0;
        border-radius: 2px;
        padding: 7px 12px;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        font-weight: 600;
      }
      #refresh:hover { background: var(--accent-dark); }
      #refresh:disabled { cursor: wait; opacity: .65; }
      .sheet-tabs { display: flex; gap: 2px; padding: 5px 12px 0; border-bottom: 1px solid var(--grid); background: #f5f5f5; }
      .sheet-tab { padding: 7px 18px; border-bottom: 3px solid var(--accent); color: var(--accent-dark); background: #fff; font-size: 13px; font-weight: 600; }
      .sheet-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
      table { width: 100%; min-width: 760px; border-collapse: collapse; table-layout: fixed; font-size: clamp(12px, 1vw, 14px); }
      col.row-num { width: var(--row-number-width); }
      col.published { width: clamp(130px, 16vw, 185px); }
      col.title { width: 40%; }
      th, td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        height: 23px;
        background: var(--header);
        color: #333;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
      }
      .resize-handle { position: absolute; top: 0; right: -4px; z-index: 4; width: 8px; height: 100%; cursor: col-resize; touch-action: none; }
      .resize-handle:hover, .resize-handle.resizing { background: var(--accent); opacity: .8; }
      .corner, .row-number { text-align: center; background: var(--header); color: #666; font-size: 12px; }
      .column-header { padding: 0; }
      .sort-button {
        width: 100%; height: 31px; padding: 0 8px; border: 0; background: transparent;
        text-align: left; color: inherit; cursor: pointer; font-weight: 700;
      }
      .sort-button:hover { background: #e9e9e9; }
      .sort-mark { margin-left: 5px; color: var(--accent); }
      tbody tr { height: 45px; }
      tbody tr:hover td:not(.row-number) { background: #f6fbf8; }
      td { padding: 6px 8px; vertical-align: middle; line-height: 1.35; background: #fff; }
      td.row-number { padding: 0; }
      .field-heading { padding: 0; background: #e2efda; font-size: 12px; font-weight: 700; }
      .field-heading .sort-button { text-align: left; }
      td.active { position: relative; outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
      .published-cell { color: #555; font-variant-numeric: tabular-nums; font-size: 13px; }
      .article-link { color: #1f1f1f; text-decoration: none; font-weight: 600; }
      .article-link:hover { color: var(--accent); text-decoration: underline; }
      .summary { color: #4a4a4a; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .state-cell { padding: 35px 24px; color: var(--muted); text-align: center; }
      .state-cell.error { color: #9d2727; }
      .state-cell code { padding: 2px 4px; border-radius: 2px; background: #f1f1f1; color: #333; }
      .statusbar { display: flex; flex: 0 0 25px; align-items: center; justify-content: space-between; min-height: 25px; padding: 0 12px; color: #fff; background: var(--accent-dark); font-size: 11px; }
      @media (max-height: 620px) {
        .ribbon { display: none; }
      }
      @media (max-width: 900px) {
        .ribbon-tabs { overflow-x: auto; }
        .ribbon-tab { flex: 0 0 auto; }
        .ribbon-group { min-width: 105px; }
      }
      @media (max-width: 640px) {
        .app { min-height: 100dvh; height: 100dvh; }
        .titlebar { min-height: 32px; }
        .ribbon-tabs { height: 31px; padding: 0 4px; }
        .ribbon-tab { padding: 0 8px; font-size: 12px; }
        .toolbar { align-items: flex-start; flex-direction: column; }
        .actions { width: 100%; justify-content: space-between; }
        .ribbon { min-height: 53px; padding-left: 7px; }
        .ribbon-group:not(:first-child) { display: none; }
        .sheet-tabs { padding-left: 5px; }
        .sheet-tab { padding: 6px 13px; }
        .sheet-scroll { min-height: 0; }
        table { min-width: 650px; }
        col.published { width: 135px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="titlebar">
        <span class="book-icon" aria-hidden="true">
          <svg viewBox="0 0 62 54" role="img">
            <path fill="#dff2e6" d="M26 3h26v48H26z"/>
            <path fill="#8ed0a8" d="M31 15h16v3H31zm0 8h16v3H31zm0 8h16v3H31zm0 8h16v3H31zM36 10h3v34h-3zm7 0h3v34h-3z"/>
            <path fill="#107c41" d="M4 8h30v38H4z"/>
            <path fill="#185c37" d="M4 8h8v38H4z"/>
            <text x="19" y="36" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">S</text>
          </svg>
        </span>
        <h1>SHEETNEWS.xlsx</h1>
      </header>
      <nav class="ribbon-tabs" aria-label="리본 메뉴"><button class="ribbon-tab">파일</button><button class="ribbon-tab active">홈</button><button class="ribbon-tab">삽입</button><button class="ribbon-tab">페이지 레이아웃</button><button class="ribbon-tab">수식</button><button class="ribbon-tab">데이터</button><button class="ribbon-tab">검토</button><button class="ribbon-tab">보기</button></nav>
      <section class="ribbon" aria-label="홈 리본">
        <div class="ribbon-group" data-label="클립보드"><button class="ribbon-button large">▣</button><button class="ribbon-button">붙여넣기</button></div>
        <div class="ribbon-group" data-label="글꼴"><button class="ribbon-button">가나다</button><button class="ribbon-button large">B</button><button class="ribbon-button"><em>I</em></button></div>
        <div class="ribbon-group" data-label="맞춤"><button class="ribbon-button">←→</button><button class="ribbon-button">≡</button><button class="ribbon-button">줄 바꿈</button></div>
        <div class="ribbon-group" data-label="정렬 및 필터"><button class="ribbon-button">A↓Z</button><button class="ribbon-button">필터</button></div>
      </section>
      <section class="formula-bar" aria-label="수식 입력줄"><span class="name-box" id="cell-name">A1</span><span class="fx">fx</span><span class="formula-value" id="formula-value">발행 시각</span></section>
      <section class="toolbar" aria-label="뉴스 도구">
        <span class="feed-label">연합뉴스 RSS · www.yna.co.kr/rss/news.xml</span>
        <div class="actions"><span id="updated-at">불러오는 중…</span><button id="refresh" type="button">↻ 새로고침</button></div>
      </section>
      <nav class="sheet-tabs" aria-label="시트"><span class="sheet-tab">연합뉴스</span></nav>
      <div class="sheet-scroll">
        <table aria-label="연합뉴스 뉴스 목록">
          <colgroup><col class="row-num"><col class="published"><col class="title"><col class="summary-col"></colgroup>
          <thead>
            <tr><th class="corner" scope="col"></th><th scope="col">A</th><th scope="col">B</th><th scope="col">C</th></tr>
          </thead>
          <tbody id="news-body"><tr><td class="row-number">1</td><td class="field-heading active" data-cell="A1">발행 시각</td><td class="field-heading" data-cell="B1">제목</td><td class="field-heading" data-cell="C1">요약</td></tr><tr><td class="state-cell" colspan="4">RSS를 불러오는 중입니다…</td></tr></tbody>
        </table>
      </div>
      <footer class="statusbar"><span>준비</span><span id="article-count">0개 레코드</span></footer>
    </main>

    <script>
      // 정적 HTML 단계에서는 프로젝트에 함께 둔 RSS 사본을 읽습니다.
      // 서버 배포 시에는 이 값을 동일 출처의 RSS 프록시(예: /api/news)로 바꾸면 됩니다.
      const RSS_URL = "./news.xml";
      const newsBody = document.querySelector("#news-body");
      const refreshButton = document.querySelector("#refresh");
      const updatedAt = document.querySelector("#updated-at");
      const cellName = document.querySelector("#cell-name");
      const formulaValue = document.querySelector("#formula-value");
      const articleCount = document.querySelector("#article-count");
      const columnDefinitions = [
        { header: document.querySelector("thead th:nth-child(2)"), column: document.querySelector("col.published"), minWidth: 120 },
        { header: document.querySelector("thead th:nth-child(3)"), column: document.querySelector("col.title"), minWidth: 190 },
        { header: document.querySelector("thead th:nth-child(4)"), column: document.querySelector("col.summary-col"), minWidth: 180 },
      ];
      let articles = [];
      let sort = { key: "published", direction: "desc" };

      function cleanText(value) {
        const holder = document.createElement("div");
        holder.innerHTML = value || "";
        return (holder.textContent || "").replace(/\s+/g, " ").trim();
      }

      function childText(item, tagName) {
        return item.querySelector(tagName)?.textContent?.trim() || "";
      }

      function parseFeed(xmlText) {
        const xml = new DOMParser().parseFromString(xmlText, "application/xml");
        if (xml.querySelector("parsererror")) throw new Error("RSS XML을 해석할 수 없습니다.");
        return [...xml.querySelectorAll("item")].map((item) => {
          const published = new Date(childText(item, "pubDate"));
          return {
            title: childText(item, "title"),
            link: childText(item, "link"),
            summary: cleanText(childText(item, "description")),
            published: Number.isNaN(published.getTime()) ? null : published,
          };
        }).filter((article) => article.title && article.link);
      }

      function formatDate(date) {
        if (!date) return "—";
        return new Intl.DateTimeFormat("ko-KR", { dateStyle: "short", timeStyle: "short" }).format(date);
      }

      function sortedArticles() {
        return [...articles].sort((a, b) => {
          const first = sort.key === "published" ? (a.published?.getTime() || 0) : a.title.localeCompare(b.title, "ko");
          const second = sort.key === "published" ? (b.published?.getTime() || 0) : 0;
          const result = sort.key === "published" ? first - second : first;
          return sort.direction === "asc" ? result : -result;
        });
      }

      function setActive(cell) {
        document.querySelectorAll("td.active").forEach((active) => active.classList.remove("active"));
        cell.classList.add("active");
        cellName.textContent = cell.dataset.cell || "";
        formulaValue.textContent = cell.textContent.trim();
      }

      function enableColumnResizing() {
        columnDefinitions.forEach(({ header, column, minWidth }) => {
          const handle = document.createElement("span");
          handle.className = "resize-handle";
          handle.title = "드래그하여 열 너비 조절";
          handle.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const startX = event.clientX;
            const startWidth = header.getBoundingClientRect().width;
            handle.classList.add("resizing");
            handle.setPointerCapture(event.pointerId);
            const resize = (moveEvent) => {
              const width = Math.max(minWidth, startWidth + moveEvent.clientX - startX);
              column.style.width = `${width}px`;
            };
            const finish = () => {
              handle.classList.remove("resizing");
              handle.removeEventListener("pointermove", resize);
              handle.removeEventListener("pointerup", finish);
              handle.removeEventListener("pointercancel", finish);
            };
            handle.addEventListener("pointermove", resize);
            handle.addEventListener("pointerup", finish);
            handle.addEventListener("pointercancel", finish);
          });
          header.append(handle);
        });
      }

      function createHeadingRow() {
        const row = document.createElement("tr");
        const rowNumber = document.createElement("td");
        rowNumber.className = "row-number";
        rowNumber.textContent = "1";
        row.append(rowNumber);
        [["published", "발행 시각", "A1"], ["title", "제목", "B1"], ["summary", "요약", "C1"]].forEach(([key, label, cell]) => {
          const heading = document.createElement("td");
          const button = document.createElement("button");
          heading.className = "field-heading";
          heading.dataset.cell = cell;
          button.className = "sort-button";
          button.textContent = label;
          if (key !== "summary") {
            const mark = document.createElement("span");
            mark.className = "sort-mark";
            mark.textContent = sort.key === key ? (sort.direction === "asc" ? "▲" : "▼") : "";
            button.append(mark);
            button.addEventListener("click", (event) => {
              event.stopPropagation();
              sort = { key, direction: sort.key === key && sort.direction === "desc" ? "asc" : "desc" };
              render();
            });
          } else button.disabled = true;
          heading.addEventListener("click", () => setActive(heading));
          heading.append(button);
          row.append(heading);
        });
        return row;
      }

      function render() {
        const rows = sortedArticles();
        const heading = createHeadingRow();
        if (!rows.length) {
          const emptyRow = document.createElement("tr");
          const emptyCell = document.createElement("td");
          emptyCell.className = "state-cell";
          emptyCell.colSpan = 4;
          emptyCell.textContent = "표시할 뉴스가 없습니다.";
          emptyRow.append(emptyCell);
          newsBody.replaceChildren(heading, emptyRow);
          articleCount.textContent = "0개 레코드";
          return;
        }
        newsBody.replaceChildren(heading, ...rows.map((article, index) => {
          const row = document.createElement("tr");
          const rowNumber = document.createElement("td");
          const published = document.createElement("td");
          const title = document.createElement("td");
          const summary = document.createElement("td");
          const link = document.createElement("a");
          const summaryText = document.createElement("div");
          rowNumber.className = "row-number";
          published.className = "published-cell";
          link.className = "article-link";
          summaryText.className = "summary";
          rowNumber.textContent = index + 2;
          published.textContent = formatDate(article.published);
          link.href = article.link;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = article.title;
          summaryText.textContent = article.summary || "—";
          title.append(link);
          summary.append(summaryText);
          [[published, `A${index + 2}`], [title, `B${index + 2}`], [summary, `C${index + 2}`]].forEach(([cell, name]) => {
            cell.dataset.cell = name;
            cell.addEventListener("click", () => setActive(cell));
          });
          row.append(rowNumber, published, title, summary);
          return row;
        }));
        articleCount.textContent = `${rows.length}개 레코드`;
      }

      function showError(error) {
        console.error(error);
        const isNetworkError = error instanceof TypeError;
        const openedAsFile = window.location.protocol === "file:";
        const message = isNetworkError && openedAsFile
          ? "파일을 직접 열면 브라우저가 news.xml 읽기를 차단합니다. 터미널에서 ‘python3 -m http.server 8000’을 실행한 뒤 http://localhost:8000 으로 접속하세요."
          : isNetworkError
          ? "news.xml을 불러올 수 없습니다. index.html과 news.xml이 같은 정적 웹 서버 경로에 있는지 확인하세요. 서버 배포 단계에서는 같은 도메인의 RSS 프록시를 연결하면 자동 갱신할 수 있습니다."
          : error.message;
        const errorRow = document.createElement("tr");
        const errorCell = document.createElement("td");
        errorCell.className = "state-cell error";
        errorCell.colSpan = 4;
        errorCell.textContent = message;
        errorRow.append(errorCell);
        newsBody.replaceChildren(createHeadingRow(), errorRow);
        updatedAt.textContent = "갱신 실패";
        articleCount.textContent = "오류";
      }

      async function loadFeed() {
        refreshButton.disabled = true;
        refreshButton.textContent = "불러오는 중…";
        updatedAt.textContent = "RSS 갱신 중…";
        try {
          const response = await fetch(RSS_URL, { cache: "no-store" });
          if (!response.ok) throw new Error(`RSS 요청에 실패했습니다. (HTTP ${response.status})`);
          articles = parseFeed(await response.text());
          render();
          updatedAt.textContent = `마지막 갱신 ${new Intl.DateTimeFormat("ko-KR", { dateStyle: "short", timeStyle: "short" }).format(new Date())}`;
        } catch (error) { showError(error); }
        finally { refreshButton.disabled = false; refreshButton.textContent = "↻ 새로고침"; }
      }

      refreshButton.addEventListener("click", loadFeed);
      enableColumnResizing();
      loadFeed();
    </script>
  </body>
</html>
